[versions]
# Plugins
shadow = "9.6.1"
runPaper = "3.1.0"

# Dependencies
paper = "26.2.build.+"
rebar = "0.43.0-26.2"
pylon = "0.41.1-26.2"
jimfs = "1.3.2"
annotations = "26.1.0"
configLib = "4.8.1"
jactl = "2.9.2"
jol = "0.17"

[libraries]
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }
pylonmc-rebar = { group = "io.github.pylonmc", name = "rebar", version.ref = "rebar" }
pylonmc-pylon = { group = "io.github.pylonmc", name = "pylon", version.ref = "pylon" }
jimfs = { group = "com.google.jimfs", name = "jimfs", version.ref = "jimfs" }
jetbrains-annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotations" }
configLib = { module = "de.exlll:configlib-yaml", version.ref = "configLib" }
jactl = { module = "io.jactl:jactl", version.ref = "jactl" }
jol = { module = "org.openjdk.jol:jol-core", version.ref = "jol" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
runPaper = { id = "xyz.jpenilla.run-paper", version.ref = "runPaper" }
